<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>练习 3：画面 = 时间的函数</title>
  <style>
    body { margin: 0; background: #fff6e9; font-family: sans-serif; color: #6b4432; text-align: center; }
    canvas { background: #ffe3ec; border: 4px solid #6b4432; border-radius: 16px; margin-top: 16px; }
    .bar { margin: 12px; font-size: 18px; }
    input { width: 360px; }
  </style>
</head>
<body>
  <canvas id="c" width="400" height="500"></canvas>
  <div class="bar">
    <button id="play">暂停</button>
    时间轴：<input id="slider" type="range" min="0" max="120" value="0" />
    第 <b id="num">0</b> 帧
  </div>

  <script>
    // 练习 2 是"每一帧在上一帧的基础上改一点"。
    // 这里换一种思路：给我一个帧号，我就能直接算出这一帧长什么样。
    // 这样可以随意跳到任何一帧，拖动时间轴就像剪辑软件一样。
    // 做视频的 Remotion 用的就是这种思路。

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const slider = document.getElementById('slider');
    const num = document.getElementById('num');
    const TOTAL = 120; // 一共 120 帧，按每秒 30 帧算就是 4 秒

    // 把 frame 在 [a, b] 区间里映射成 0~1，超出范围就停在两端
    function progress(frame, a, b) {
      return Math.min(1, Math.max(0, (frame - a) / (b - a)));
    }

    // 核心：只根据 frame 画出整张画面
    function draw(frame) {
      ctx.clearRect(0, 0, 400, 500);

      // 第 0~40 帧：花从地里长出来
      const grow = progress(frame, 0, 40);
      ctx.strokeStyle = '#52B889';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(200, 480);
      ctx.lineTo(200, 480 - grow * 250);
      ctx.stroke();

      // 第 40~70 帧：花瓣一片片张开
      const open = progress(frame, 40, 70);
      const cx = 200;
      const cy = 480 - grow * 250;
      for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2 + frame / 30;
        ctx.fillStyle = i % 2 ? '#FF7FA3' : '#FFB7C9';
        ctx.beginPath();
        ctx.ellipse(cx + Math.cos(angle) * 40 * open, cy + Math.sin(angle) * 40 * open, 30 * open, 18 * open, angle, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#FFC83D';
      ctx.beginPath();
      ctx.arc(cx, cy, 22 * open, 0, Math.PI * 2);
      ctx.fill();

      // 第 70~120 帧：文字淡入
      const text = progress(frame, 70, 100);
      ctx.globalAlpha = text;
      ctx.fillStyle = '#6B4432';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('送给佳佳的小花', 200, 80);
      ctx.globalAlpha = 1;
    }

    let frame = 0;
    let playing = true;

    function tick() {
      if (playing) {
        frame = (frame + 0.5) % TOTAL; // 屏幕每秒 60 次，每次 +0.5 帧 ≈ 每秒 30 帧
        slider.value = frame;
      }
      draw(frame);
      num.textContent = Math.floor(frame);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    slider.oninput = () => {
      playing = false;
      document.getElementById('play').textContent = '播放';
      frame = Number(slider.value);
    };
    document.getElementById('play').onclick = (e) => {
      playing = !playing;
      e.target.textContent = playing ? '暂停' : '播放';
    };

    // 动手改一改：
    // 1. 拖动时间轴，看看每一帧是不是都能直接算出来
    // 2. 把花瓣数量 6 改成 8
    // 3. 把 progress(frame, 0, 40) 改成 progress(frame, 0, 80)，花会长得更慢
    // 4. 把"送给佳佳的小花"改成你想说的话
  </script>
</body>
</html>
